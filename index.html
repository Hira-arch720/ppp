<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Clone - Bootstrap</title>

    <!-- Bootstrap 5.3 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Header -->
    <header class="d-flex justify-content-end p-3">
        <ul class="nav align-items-center">
            <li class="nav-item">
                <a class="nav-link text-dark small" href="#">Gmail</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-dark small" href="#">Images</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">
                    <img src="images/menuIcon.png" width="20">
                </a>
            </li>
            <li class="nav-item">
                <button class="btn btn-primary btn-sm px-4">Sign In</button>
            </li>
        </ul>
    </header>

    <!-- Main Content -->
    <main class="flex-grow-1 d-flex flex-column justify-content-center align-items-center text-center">

        <div class="container" style="max-width:580px;">

            <!-- Logo -->
            <img src="images/google.png" class="img-fluid mb-4" width="270">

            <!-- Search Box -->
            <div class="position-relative mb-3">

                <input type="text" class="form-control rounded-pill py-3 ps-5 pe-5" placeholder="Search Google">

                <!-- Left Icon -->
                <span class="position-absolute top-50 start-0 translate-middle-y ps-3">
                    <img src="images/search.png" width="18">
                </span>

                <!-- Right Icons -->
                <span class="position-absolute top-50 end-0 translate-middle-y pe-3 d-flex gap-3">
                    <img src="images/mic.png" width="18">
                    <img src="images/googlelens.png" width="18">
                </span>

            </div>

            <!-- Buttons -->
            <div class="d-flex justify-content-center gap-2">
                <button class="btn btn-light border">Google Search</button>
                <button class="btn btn-light border">I'm Feeling Lucky</button>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-light mt-auto">
        <div class="container-fluid border-top py-3">
            <p class="text-muted small mb-2">Pakistan</p>
        </div>

        <div class="container-fluid border-top py-3 d-flex flex-column flex-md-row justify-content-between">

            <ul class="nav small">
                <li class="nav-item"><a class="nav-link text-muted" href="#">About</a></li>
                <li class="nav-item"><a class="nav-link text-muted" href="#">Advertising</a></li>
                <li class="nav-item"><a class="nav-link text-muted" href="#">Business</a></li>
                <li class="nav-item"><a class="nav-link text-muted" href="#">How Search works</a></li>
            </ul>

            <ul class="nav small">
                <li class="nav-item"><a class="nav-link text-muted" href="#">Privacy</a></li>
                <li class="nav-item"><a class="nav-link text-muted" href="#">Terms</a></li>
                <li class="nav-item"><a class="nav-link text-muted" href="#">Settings</a></li>
            </ul>

        </div>
    </footer>

</body>
</html>
